<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenClaw 诊断面板</title>
<link rel="preconnect" href="/">
<link rel="preload" href="/static/app.js?v=40" as="script">
<link rel="preload" href="/api/dates" as="fetch" crossorigin>
<style>
/* 关键内联 CSS — 首屏骨架样式，避免 FOUC */
:root{--bg:#0d1117;--bg2:#161b22;--card:#1c2128;--text:#e6edf3;--text2:#8b949e;--border:#30363d;--blue:#58a6ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.container{max-width:1400px;margin:0 auto;padding:12px 16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.header h1{font-size:20px;white-space:nowrap}
.header h1 span{color:var(--blue)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.controls select,.controls button{background:var(--card);color:var(--text);border:1px solid var(--border);padding:4px 10px;border-radius:6px;font-size:13px;cursor:pointer}
.controls button:hover{border-color:var(--blue)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;text-align:center}
.card .label{font-size:11px;color:var(--text2);margin-bottom:4px}
.card .value{font-size:20px;font-weight:600}
.loading-skeleton{height:80px;background:linear-gradient(90deg,var(--card) 25%,var(--bg2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
<link rel="stylesheet" href="/static/style.css?v=40">
</head>
<body>
<div class="container">
  <div id="sysInfoBar" class="sysinfo-bar" style="display:none"></div>
  <div class="header">
    <h1>🔍 <span>OpenClaw</span> 诊断面板 <span id="modeIndicator" style="display:none"></span> <span style="font-size:11px;color:#888;font-weight:normal;margin-left:8px">🕐 北京时间 (UTC+8)</span></h1>
    <div class="controls">
      <div class="node-selector-wrap">
        <select id="nodeSelect" title="选择节点"></select>
      </div>
      <select id="dateSelect"></select>
      <button onclick="refresh()">🔄 刷新</button>
      <label>自动刷新:
        <select id="autoRefreshSelect">
          <option value="0">关闭</option>
          <option value="5000">5s</option>
          <option value="10000">10s</option>
          <option value="30000" selected>30s</option>
          <option value="60000">1min</option>
          <option value="300000">5min</option>
        </select>
      </label>
    </div>
  </div>

  <!-- 骨架屏占位 -->
  <div id="skeletonCards" class="cards" style="margin-bottom:10px">
    <div class="loading-skeleton"></div>
    <div class="loading-skeleton"></div>
    <div class="loading-skeleton"></div>
    <div class="loading-skeleton"></div>
    <div class="loading-skeleton"></div>
  </div>

  <!-- 总览摘要卡片 -->
  <div id="summaryCards" class="cards"></div>
  <div id="summaryCards2" class="cards"></div>
  <div id="summaryCards3" class="cards"></div>
  <div id="summaryCards4" class="cards"></div>

  <!-- 探测控制面板 -->
  <div id="probesSection" class="section collapsible">
    <div class="section-header" onclick="toggleSection(this)">
      <h2>🔍 系统探测</h2>
      <button class="probe-run-all-btn" onclick="event.stopPropagation(); runAllProbes()">▶ 全部执行</button>
      <span class="toggle-icon">▼</span>
    </div>
    <div class="section-body open" id="probesBody">
      <div id="probeCards" class="probe-cards"></div>
      <div id="probeResults" class="probe-results"></div>
    </div>
  </div>

  <!-- 消息处理流水线 (仅高级模式) -->
  <div id="pipelineSection" class="section collapsible" style="display:none">
    <div class="section-header" onclick="toggleSection(this)">
      <h2>📡 消息处理流水线</h2>
      <span class="toggle-icon">▼</span>
    </div>
    <div class="section-body open" id="pipelineBody"></div>
  </div>

  <!-- Gateway 重启历史 -->
  <div id="restartsSection" class="section collapsible" style="display:none">
    <div class="section-header" onclick="toggleSection(this)">
      <h2>🔄 Gateway 重启历史</h2>
      <span class="toggle-icon">▼</span>
    </div>
    <div class="section-body open" id="restartsBody"></div>
  </div>

  <!-- 模型调用记录 (两种模式都有) -->
  <div id="modelCallsSection" class="section collapsible" style="display:none">
    <div class="section-header" onclick="toggleSection(this)">
      <h2>🤖 模型调用记录</h2>
      <span class="toggle-icon">▼</span>
    </div>
    <div class="section-body open" id="modelCallsBody"></div>
  </div>

  <!-- 会话浏览器 (默认折叠) -->
  <div id="conversationSection" class="section collapsible" style="display:none">
    <div class="section-header" onclick="toggleConversationSection(this)">
      <h2>💬 会话浏览器</h2>
      <span class="toggle-icon">▼</span>
    </div>
    <div class="section-body" id="conversationBody">
      <div id="conversationControls" class="conversation-controls">
        <select id="sessionSelect" onchange="loadConversationTree()">
          <option value="">选择会话...</option>
        </select>
        <span id="sessionInfo" class="session-info"></span>
      </div>
      <div id="conversationTree"></div>
    </div>
  </div>

  <!-- 锁定提示：Run 详情 (标准模式显示) -->
  <div id="lockedRunsSection" class="section locked-section" style="display:none">
    <div class="locked-content">
      <div class="locked-icon">🔒</div>
      <div class="locked-text">
        <strong>Run 详情</strong> — 需要高级诊断模式
        <div class="locked-hint">启动时添加 <code>--advanced</code> 参数以解锁此功能</div>
      </div>
    </div>
  </div>

  <!-- 锁定提示：事件管道 (标准模式显示) -->
  <div id="lockedEventsSection" class="section locked-section" style="display:none">
    <div class="locked-content">
      <div class="locked-icon">🔒</div>
      <div class="locked-text">
        <strong>事件管道 & 错误追踪</strong> — 需要高级诊断模式
        <div class="locked-hint">启动时添加 <code>--advanced</code> 参数，并开启 <code>diagnostics.enabled</code> + <code>logging.level: debug</code></div>
      </div>
    </div>
  </div>

  <!-- Run 列表 (仅高级模式) -->
  <div id="content"></div>

  <!-- 错误列表 (仅高级模式) -->
  <div id="errorsSection" class="section collapsible" style="display:none">
    <div class="section-header" onclick="toggleSection(this)">
      <h2>⚠️ 错误 <span class="section-badge error" id="errorCount"></span></h2>
      <span class="toggle-icon">▼</span>
    </div>
    <div class="section-body open" id="errorsBody"></div>
  </div>

</div>
<script defer src="/static/app.js?v=40"></script>
</body>
</html>
