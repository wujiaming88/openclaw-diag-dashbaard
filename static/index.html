<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenClaw 诊断面板</title>
<link rel="preconnect" href="/">
<link rel="preload" href="/static/app.js?v=12" as="script">
<link rel="preload" href="/api/dates" as="fetch" crossorigin>
<style>
/* 关键内联 CSS — 首屏骨架样式，避免 FOUC */
:root{--bg:#0d1117;--bg2:#161b22;--card:#1c2128;--text:#e6edf3;--text2:#8b949e;--border:#30363d;--blue:#58a6ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.container{max-width:1400px;margin:0 auto;padding:12px 16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.header h1{font-size:20px;white-space:nowrap}
.header h1 span{color:var(--blue)}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.controls select,.controls button{background:var(--card);color:var(--text);border:1px solid var(--border);padding:4px 10px;border-radius:6px;font-size:13px;cursor:pointer}
.controls button:hover{border-color:var(--blue)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px;text-align:center}
.card .label{font-size:11px;color:var(--text2);margin-bottom:4px}
.card .value{font-size:20px;font-weight:600}
.loading-skeleton{height:80px;background:linear-gradient(90deg,var(--card) 25%,var(--bg2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
<link rel="stylesheet" href="/static/style.css?v=12">
</head>
<body>
<div class="container">
  <div id="sysInfoBar" class="sysinfo-bar" style="display:none"></div>
  <div class="header">
    <h1>🔍 <span>OpenClaw</span> 诊断面板</h1>
    <div class="controls">
      <select id="dateSelect"></select>
      <button onclick="refresh()">🔄 刷新</button>
      <label>自动刷新:
        <select id="autoRefreshSelect">
          <option value="0">关闭</option>
          <option value="5000">5s</option>
          <option value="10000">10s</option>
          <option value="30000" selected>30s</option>
          <option value="60000">1min</option>
          <option value="300000">5min</option>
        </select>
      </label>
    </div>
  </div>

  <!-- 骨架屏占位 -->
  <div id="skeletonCards" class="cards" style="margin-bottom:10px">
    <div class="loading-skeleton"></div>
    <div class="loading-skeleton"></div>
    <div class="loading-skeleton"></div>
    <div class="loading-skeleton"></div>
    <div class="loading-skeleton"></div>
  </div>

  <!-- 总览摘要卡片 -->
  <div id="summaryCards" class="cards"></div>
  <div id="summaryCards2" class="cards"></div>
  <div id="summaryCards3" class="cards"></div>

  <!-- 消息处理流水线 -->
  <div id="pipelineSection" class="section collapsible" style="display:none">
    <div class="section-header" onclick="toggleSection(this)">
      <h2>📡 消息处理流水线</h2>
      <span class="toggle-icon">▼</span>
    </div>
    <div class="section-body open" id="pipelineBody"></div>
  </div>

  <!-- 模型调用记录 -->
  <div id="modelCallsSection" class="section collapsible" style="display:none">
    <div class="section-header" onclick="toggleSection(this)">
      <h2>🤖 模型调用记录 <span id="modelCallsCount" class="badge"></span></h2>
      <span class="toggle-icon">▶</span>
    </div>
    <div class="section-body" id="modelCallsBody"></div>
  </div>

  <!-- Run 列表 -->
  <div id="content"></div>

  <!-- 错误列表 -->
  <div id="errorsSection" class="section collapsible" style="display:none">
    <div class="section-header" onclick="toggleSection(this)">
      <h2>❌ 错误列表 <span id="errorCount" class="badge error"></span></h2>
      <span class="toggle-icon">▼</span>
    </div>
    <div class="section-body open" id="errorsBody"></div>
  </div>

</div>
<script defer src="/static/app.js?v=12"></script>
</body>
</html>
